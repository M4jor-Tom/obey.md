[package]
name = "obey"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
anyhow = "1"
