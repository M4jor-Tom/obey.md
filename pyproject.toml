[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gltf-scene-orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
